name: inception

networks:
  inception:
    driver: bridge

volumes:
  inception_website:
    external: true
  inception_database:
    external: true

services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    secrets:
      - DB_PWD
      - MYSQL_ROOT_PASSWORD
    volumes:
      - inception_database:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
    networks:
      - inception
    restart: always
  wordpress:
    depends_on:
      - mariadb
    container_name: wordpress
    build: ./requirements/wordpress
    volumes:
      - inception_website:/var/www/html
    secrets:
      - DB_PWD
    environment:
      - WORDPRESS_DB_HOST=${DB_HOST}:3306
      - WORDPRESS_DB_NAME=${DB_NAME}
      - WORDPRESS_DB_USER=${DB_USER}
      - WORDPRESS_DB_PASSWORD_FILE=/run/secrets/DB_PWD
    networks:
      - inception
    restart: always
  nginx:
    depends_on:
      - wordpress
    container_name: nginx
    build: ./requirements/nginx
    volumes:
    - inception_website:/var/www/html
    ports:
      - '443:443'
    secrets:
      - NGINX_PRIVKEY
      - NGINX_CERT
    networks:
      - inception
    restart: always

secrets:
  DB_PWD:
    file: ../secrets/db_password.txt
  MYSQL_ROOT_PASSWORD:
    file: ../secrets/db_root_password.txt
  NGINX_PRIVKEY:
    file: ../secrets/privkey.pem
  NGINX_CERT:
    file: ../secrets/cert.pem